[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-ref"
version = "0.1.0"
description = "Python reference decoder for the mi-realtime motor-imagery engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.4", "maturin>=1.5,<2.0", "hypothesis>=6.100,<7"]
live = ["pylsl>=1.16,<2"]

[tool.setuptools]
packages = ["mi_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
